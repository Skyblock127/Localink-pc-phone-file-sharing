plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ravi.fileshare'
    compileSdk 35

    defaultConfig {
        applicationId "com.ravi.fileshare"
        minSdk 30
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    // The protocol, crypto and transfer engine are compiled straight from the
    // same sources the laptop app uses, so the two can never drift apart.
    sourceSets {
        main {
            java.srcDirs += ['../../shared/src']
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'com.google.android.material:material:1.12.0'
}
